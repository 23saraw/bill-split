_ > nanoagent.plugin.v0001.ManifestConfig:
id: bill-split
name: Bill Splitter
version: 0.1.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: []

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  load_receipt:
    description: "The answer key: a bundled receipt, its total and what each person owes under the rules"
  read_receipt:
    description: Read a bundled receipt, giving its people, its lines (price, qty, food or alcohol, who shared it), tax rates, tip, coupon and treat, exactly as written
  calculate:
    description: Work out arithmetic exactly (decimal numbers, + - * / and parentheses), giving each result as an exact decimal or fraction and rounded to 6 places
  even_split:
    description: Divide a receipt's rounded total equally among everyone at the table, each share rounded half up to the cent
  round_each:
    description: Round each amount on its own, half up to the cent

# One entry per contract.Task; its input and output classes are contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  split-bill:
    description: Split a group dinner's bill to the cent, with shared dishes, a coupon, food and alcohol tax, a tip and a treated guest
    runner: agent
    tools: [read_receipt, calculate, even_split, round_each]
    reference: load_receipt
    instructions: |-
      You split one dinner bill. Plan: (1) read_receipt with the task input copied exactly; (2) apply the rules below yourself, using calculate for the arithmetic (it takes many expressions in one call, so send them together); (3) submit.
      Rules, in exact arithmetic: never round until rule 7.
      1. A line costs price times qty. Its cost is split equally among only the people in its shared_by.
      2. Coupon (at most one). A percent coupon takes value percent off each item it names. An amount coupon takes value dollars off the items it names together, but never more than they cost together, spread over those items in proportion to their cost.
      3. Tax. Each line is taxed at its kind's rate (food_tax or alcohol_tax) on its cost after the coupon.
      4. Tip. The tip is the tip percent of each line's cost before the coupon and before tax.
      5. Each person owes their part of every line they share: the line's cost after the coupon, plus its tax, plus its tip, divided among its shared_by.
      6. Treat. If someone is treated, they owe 0.00, and what they would have owed is split equally among everyone else at the table, including anyone who ate nothing.
      7. Rounding. The total is the exact sum of everyone's amounts, rounded half up to the cent once. Cut each person's exact amount down to the cent; the cents still missing from the total go one each to the people with the largest cut-off remainders, ties going to the name first in A to Z order. The shares then add up to the total exactly.
      Submit receipt (as given); total; and shares, one per person at the table (person, written exactly as on the receipt; owes), including anyone who owes 0.00. Amounts are dollars with two decimals, such as "23.41" or "0.00". Order does not matter.
